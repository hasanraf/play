<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>IPTV Pro •</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #0b1220;
    color: white;
    overflow-x: hidden;
}

/* HEADER */
.header {
    padding: 16px 18px;
    font-size: 20px;
    font-weight: 700;
    background: #111827;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
}

.header span {
    background: linear-gradient(135deg, #e50914, #ff4d4d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 14px;
    font-weight: 500;
}

/* TABS - horizontal scroll optimized for mobile */
.tabs {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    background: #0f172a;
}

.tab {
    padding: 8px 18px;
    background: #1e293b;
    border-radius: 40px;
    white-space: nowrap;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
    scroll-snap-align: start;
    flex-shrink: 0;
}

.tab.active {
    background: #e50914;
    box-shadow: 0 2px 12px rgba(229,9,20,0.5);
}

/* GRID - responsive mobile first */
.grid {
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

/* CARD */
.card {
    background: #111827;
    border-radius: 18px;
    padding: 14px 10px;
    cursor: pointer;
    transition: 0.2s;
    text-align: center;
    border: 1px solid #1e2a3a;
    backdrop-filter: blur(2px);
}

.card:active {
    transform: scale(0.97);
    background: #1f2937;
}

.logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
    border-radius: 14px;
    margin-bottom: 10px;
    background: #0f172a;
}

.name {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.3;
    word-break: break-word;
}

.group {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 5px;
}

.live {
    background: #e50914;
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: bold;
    margin-top: 8px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(229,9,20,0.6); }
    100% { box-shadow: 0 0 0 10px rgba(229,9,20,0); }
}

/* PLAYER OVERLAY - FULLSCREEN FIXED */
.player {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    z-index: 99999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

.player video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* CONTROL BAR - MUST BE VISIBLE ON MOBILE */
.player-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    left: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 15px;
    z-index: 100001;
    pointer-events: none;
}

.player-controls button {
    pointer-events: auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    -webkit-tap-highlight-color: transparent;
}

.player-controls button:active {
    transform: scale(0.92);
    background: #e50914;
}

.close-btn {
    background: rgba(229,9,20,0.9);
}

.rotate-btn {
    background: rgba(0, 0, 0, 0.8);
}

/* ERROR */
.error {
    text-align: center;
    padding: 24px;
    color: #ff9e8f;
    background: #1e1a2f;
    border-radius: 20px;
    margin: 20px;
    font-size: 14px;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #aaa;
    font-size: 15px;
    grid-column: span 2;
}

/* TABLET + DESKTOP */
@media (min-width: 600px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
    }
    .header {
        font-size: 24px;
    }
    .name {
        font-size: 14px;
    }
}

@media (min-width: 900px) {
    .grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* FIX FOR MOBILE: ensure rotate button always shows */
@media (max-width: 700px) {
    .player-controls button {
        width: 48px;
        height: 48px;
        font-size: 22px;
    }
    .player-controls {
        top: 15px;
        right: 15px;
        left: auto;
    }
}

/* additional: prevent body scroll when player open */
body.player-open {
    overflow: hidden;
}
</style>
</head>
<body>

<div class="header">
    📺 Free Live TV
    <span>🔄 Tap & Rotate</span>
</div>

<div class="tabs" id="tabs"></div>

<div class="grid" id="grid">
    <div class="loading">📡 Loading channels... please wait</div>
</div>

<div class="player" id="player">
    <div class="player-controls">
        <button class="rotate-btn" id="rotateScreenBtn" title="Rotate Screen (Landscape/Portrait)">🔄</button>
        <button class="close-btn" id="closePlayerBtn" title="Close Player">✕</button>
    </div>
    <video id="video" controls autoplay playsinline webkit-playsinline></video>
</div>

<script>
/* ========= PLAYLISTS (Fifa2026 first) ========= */
const playlists = [
    { name: 'Fifa2026', url: 'https://raw.githubusercontent.com/hasanraf/FIfa/refs/heads/main/Fifa2026.m3u' },
    { name: 'BDTV', url: 'https://raw.githubusercontent.com/hasanraf/BDzone/refs/heads/main/BDTv.m3u' },
    { name: 'Sports', url: 'https://raw.githubusercontent.com/hasanraf/sports/refs/heads/main/sports.m3u' },
    { name: 'Entertainment', url: 'https://raw.githubusercontent.com/hasanraf/entertainment/refs/heads/main/entertainment.m3u' },
    { name: 'Movies', url: 'https://raw.githubusercontent.com/hasanraf/Movies/refs/heads/main/movie.m3u' },
    { name: 'Music', url: 'https://raw.githubusercontent.com/hasanraf/musicandother/refs/heads/main/musicandother.m3u' },
    { name: 'News', url: 'https://raw.githubusercontent.com/hasanraf/News/refs/heads/main/news.m3u' },
    { name: 'Kids', url: 'https://raw.githubusercontent.com/hasanraf/Kids/refs/heads/main/kids.m3u' },
    { name: 'Wild Life', url: 'https://raw.githubusercontent.com/hasanraf/wildlife/refs/heads/main/wild.m3u' }
];

let currentChannels = [];
let hls = null;
let currentVideoUrl = '';

/* Helper: escape HTML */
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

/* CREATE TABS */
const tabsContainer = document.getElementById("tabs");
playlists.forEach((p, idx) => {
    const tab = document.createElement("div");
    tab.className = "tab";
    if (idx === 0) tab.classList.add("active");
    tab.innerText = p.name;
    tab.onclick = (e) => {
        e.stopPropagation();
        loadCategory(p.url, tab);
    };
    tabsContainer.appendChild(tab);
});

/* LOAD M3U PLAYLIST */
async function loadCategory(url, tabElement) {
    try {
        const gridDiv = document.getElementById("grid");
        gridDiv.innerHTML = `<div class="loading">⏳ Loading ${tabElement.innerText} channels ...</div>`;
        
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tabElement.classList.add("active");

        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const m3uText = await response.text();
        const lines = m3uText.split(/\r?\n/);
        
        let channels = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (line && line.includes("#EXTINF")) {
                const extinfLine = line;
                let channelName = extinfLine.split(",")[1] || "Channel";
                channelName = channelName.trim();
                let streamUrl = (i + 1 < lines.length) ? lines[i + 1]?.trim() : "";
                if (streamUrl && (streamUrl.startsWith("http://") || streamUrl.startsWith("https://"))) {
                    let logoMatch = extinfLine.match(/tvg-logo="(.*?)"/);
                    let logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/70?text=TV";
                    let groupMatch = extinfLine.match(/group-title="(.*?)"/);
                    let group = groupMatch ? groupMatch[1] : tabElement.innerText;
                    
                    channels.push({
                        name: channelName,
                        url: streamUrl,
                        logo: logo,
                        group: group
                    });
                }
            }
        }
        
        currentChannels = channels;
        if (channels.length === 0) {
            document.getElementById("grid").innerHTML = `<div class="error">⚠️ No channels found in this playlist.<br>Check M3U format.</div>`;
        } else {
            renderChannels(channels);
        }
    } catch (err) {
        console.error(err);
        document.getElementById("grid").innerHTML = `<div class="error">❌ Failed to load channels<br>${err.message}</div>`;
    }
}

/* RENDER CHANNELS */
function renderChannels(channelsList) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    channelsList.forEach(ch => {
        const safeUrl = ch.url.replace(/'/g, "\\'");
        const escapedName = escapeHtml(ch.name);
        const escapedGroup = escapeHtml(ch.group);
        const logoUrl = ch.logo || "https://via.placeholder.com/70";
        
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = (function(url) {
            return function() { playStream(url); };
        })(ch.url);
        
        card.innerHTML = `
            <img class="logo" src="${logoUrl}" onerror="this.src='https://via.placeholder.com/70?text=No+Logo'">
            <div class="name">${escapedName}</div>
            <div class="group">${escapedGroup}</div>
            <div class="live">LIVE</div>
        `;
        grid.appendChild(card);
    });
}

/* ========== ADVANCED SCREEN ROTATION - WORKING ON MOBILE ========== */
function forceRotateTo(orientationMode) {
    // orientationMode: 'landscape' or 'portrait'
    if (screen.orientation && screen.orientation.lock) {
        try {
            screen.orientation.lock(orientationMode).catch(err => {
                console.warn("Orientation lock failed:", err);
                fallbackCustomRotation(orientationMode);
            });
        } catch (err) {
            fallbackCustomRotation(orientationMode);
        }
    } else {
        fallbackCustomRotation(orientationMode);
    }
}

// Enhanced fallback with CSS + fullscreen hint for mobiles that don't support orientation lock
function fallbackCustomRotation(mode) {
    const playerDiv = document.getElementById("player");
    // detect current rotation transform
    if (mode === 'landscape') {
        // apply rotate 90deg to player container (works on most mobile browsers)
        playerDiv.style.transform = "rotate(0deg)";
        // Request fullscreen for better rotation feeling
        const videoElem = document.getElementById("video");
        if (videoElem && !document.fullscreenElement) {
            videoElem.requestFullscreen().catch(e => console.log("fullscreen", e));
        }
        // set orientation hint using CSS to rotate video parent
        playerDiv.style.transform = "rotate(90deg)";
        playerDiv.style.width = "100vh";
        playerDiv.style.height = "100vw";
        playerDiv.style.transformOrigin = "center center";
        playerDiv.style.position = "fixed";
        playerDiv.style.top = "0";
        playerDiv.style.left = "0";
        // adjust inner video size
        const vid = document.getElementById("video");
        if (vid) vid.style.transform = "rotate(-90deg)";
        document.body.style.overflow = "hidden";
    } else {
        // portrait mode reset
        playerDiv.style.transform = "";
        playerDiv.style.width = "100%";
        playerDiv.style.height = "100%";
        const vid = document.getElementById("video");
        if (vid) vid.style.transform = "";
        document.body.style.overflow = "";
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(e=>{});
        }
    }
}

// Smart rotation toggle - detects current orientation and swaps
function smartRotateScreen() {
    // Check if screen orientation API exists and use it
    if (screen.orientation && screen.orientation.type) {
        const isLandscape = screen.orientation.type.includes("landscape");
        if (isLandscape) {
            forceRotateTo('portrait');
        } else {
            forceRotateTo('landscape');
        }
    } else {
        // Fallback: detect based on window inner dimensions
        const isLandscape = window.innerWidth > window.innerHeight;
        const playerDiv = document.getElementById("player");
        if (playerDiv.style.transform && playerDiv.style.transform.includes("rotate")) {
            // reset
            playerDiv.style.transform = "";
            playerDiv.style.width = "100%";
            playerDiv.style.height = "100%";
            const vid = document.getElementById("video");
            if (vid) vid.style.transform = "";
            document.body.style.overflow = "";
            if (document.fullscreenElement) document.exitFullscreen();
        } else {
            fallbackCustomRotation('landscape');
        }
    }
}

/* CLOSE PLAYER & RESET ROTATION */
function closePlayer() {
    const playerDiv = document.getElementById("player");
    playerDiv.style.display = "none";
    const video = document.getElementById("video");
    video.pause();
    video.src = "";
    if (hls) {
        hls.destroy();
        hls = null;
    }
    // reset any rotation transforms
    playerDiv.style.transform = "";
    playerDiv.style.width = "100%";
    playerDiv.style.height = "100%";
    playerDiv.style.position = "fixed";
    const vid = document.getElementById("video");
    if (vid) vid.style.transform = "";
    document.body.style.overflow = "";
    document.body.classList.remove("player-open");
    // exit fullscreen if needed
    if (document.fullscreenElement) {
        document.exitFullscreen().catch(e => {});
    }
    // unlock orientation if previously locked
    if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch(e) {}
    }
}

/* PLAY STREAM USING HLS.JS */
function playStream(url) {
    if (!url) return;
    currentVideoUrl = url;
    if (hls) {
        hls.destroy();
        hls = null;
    }
    const video = document.getElementById("video");
    video.pause();
    video.src = "";
    
    const playerDiv = document.getElementById("player");
    playerDiv.style.display = "flex";
    document.body.classList.add("player-open");
    
    // reset any previous rotation styles on player
    playerDiv.style.transform = "";
    playerDiv.style.width = "100%";
    playerDiv.style.height = "100%";
    if (video) video.style.transform = "";
    
    if (Hls.isSupported()) {
        hls = new Hls({
            debug: false,
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 60
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.warn("autoplay error:", e));
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                } else {
                    closePlayer();
                    showTemporaryError("Stream error, please try another channel.");
                }
            }
        });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch(e => console.log("play error", e));
    } else {
        closePlayer();
        showTemporaryError("HLS not supported on this browser.");
    }
}

function showTemporaryError(msg) {
    const grid = document.getElementById("grid");
    const errDiv = document.createElement("div");
    errDiv.className = "error";
    errDiv.innerText = "⚠️ " + msg;
    grid.prepend(errDiv);
    setTimeout(() => errDiv.remove(), 3500);
}

/* EVENT LISTENERS - ROTATE BUTTON VISIBLE & WORKING ON MOBILE */
const rotateBtn = document.getElementById("rotateScreenBtn");
const closeBtn = document.getElementById("closePlayerBtn");

if (rotateBtn) {
    rotateBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        smartRotateScreen();
    });
}

if (closeBtn) {
    closeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        closePlayer();
    });
}

// Optional: Handle Escape key
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("player").style.display === "flex") {
        closePlayer();
    }
});

// Lock body scroll when player open
const observer = new MutationObserver(() => {
    const player = document.getElementById("player");
    if (player.style.display === "flex") {
        document.body.style.overflow = "hidden";
    } else {
        document.body.style.overflow = "";
    }
});
observer.observe(document.getElementById("player"), { attributes: true, attributeFilter: ["style"] });

// Auto load first tab on window load & verify rotate button visibility
window.onload = () => {
    const firstTab = document.querySelector(".tab");
    if (firstTab && playlists.length) {
        loadCategory(playlists[0].url, firstTab);
    }
    
    // Small fix to ensure rotate button never hidden on mobile: log console assurance
    console.log("✅ IPTV Ready - Rotate button active on mobile");
    
    // additional fallback: if screen orientation event, remove conflict transforms
    window.addEventListener("orientationchange", () => {
        const playerDiv = document.getElementById("player");
        if (playerDiv.style.display === "flex") {
            // remove custom transforms when device rotates natively
            playerDiv.style.transform = "";
            playerDiv.style.width = "100%";
            playerDiv.style.height = "100%";
            const vid = document.getElementById("video");
            if (vid) vid.style.transform = "";
            document.body.style.overflow = "hidden";
        }
    });
    
    // For browsers that support fullscreen API
    document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
            const playerDiv = document.getElementById("player");
            if (playerDiv && playerDiv.style.transform) {
                playerDiv.style.transform = "";
                const vid = document.getElementById("video");
                if (vid) vid.style.transform = "";
            }
        }
    });
};

// make closePlayer globally available for inline onclick if any
window.closePlayer = closePlayer;
</script>
</body>
</html>
