<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPTV Premium</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #e50914;
    --bg-dark: #0b1220;
    --card-bg: #111827;
    --hover-bg: #1f2937;
    --accent: #10b981;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg-dark);
    color: white;
    padding-bottom: 30px;
    overflow-x: hidden;
}

.header {
    padding: 14px;
    font-size: 18px;
    font-weight: 700;
    background: var(--card-bg);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #1f2937;
}

/* COMPACT FIFA WIDGET */
.fifa-widget {
    background: linear-gradient(135deg, #172554, #0f172a);
    margin: 10px;
    border-radius: 12px;
    padding: 10px;
    border: 1px solid #1e40af;
}

.widget-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #38bdf8;
}

.match-box {
    background: rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.match-box:last-child { margin-bottom: 0; }

.match-teams {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 65%;
}

.team {
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.score-area {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #020617;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    color: #f8fafc;
    min-width: 42px;
    justify-content: center;
}

.match-meta {
    text-align: right;
    width: 35%;
}

.match-time {
    font-size: 10px;
    color: #94a3b8;
    display: block;
}

.match-status {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
}

.live-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: blink 1s infinite;
    margin-right: 3px;
}

/* TABS */
.tabs {
    display: flex;
    gap: 8px;
    padding: 5px 10px;
    overflow-x: auto;
    scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
    padding: 6px 14px;
    background: var(--card-bg);
    border-radius: 999px;
    white-space: nowrap;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid #1f2937;
}

.tab.active {
    background: var(--primary);
    border-color: var(--primary);
}

/* GRID RESPONSIVE */
.grid {
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
}

@media(min-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}

/* CARD */
.card {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: transform 0.2s;
    text-align: center;
    border: 1px solid #1f2937;
}

.card:hover { transform: translateY(-2px); }

.logo {
    width: 50px;
    height: 50px;
    object-fit: contain;
    border-radius: 8px;
    margin-bottom: 6px;
    background: #0f172a;
}

.name {
    font-weight: 600;
    font-size: 12px;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    height: 28px;
}

.group {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 2px;
}

.live-badge {
    background: var(--primary);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 8px;
    font-weight: 700;
    margin-top: 6px;
    display: inline-block;
}

/* 🎯 FORCE LANDSCAPE PLAYER (১০০% পাতাল স্ক্রিন নিশ্চিত করার জন্য CSS) */
.player {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    display: none;
    z-index: 99999;
}

/* মোবাইল সোজা থাকলেও এই ক্লাসটি ভিডিওকে জোর করে ঘুরিয়ে পাতাল করে দেবে */
@media (orientation: portrait) {
    .player.force-rotate {
        width: 100vh !important;
        height: 100vw !important;
        transform: rotate(90deg);
        transform-origin: top left;
        position: fixed;
        top: 0;
        left: 100vw;
    }
}

.player video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.player-controls {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    z-index: 100000;
    pointer-events: none;
}

.player-btn {
    pointer-events: auto;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
}
.player-btn.close-btn { background: var(--primary); }

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.error {
    grid-column: 1/-1;
    text-align: center;
    padding: 30px 10px;
    color: #f87171;
    font-size: 13px;
}
</style>
</head>
<body>

<div class="header">📺 Free Live TV</div>

<div class="fifa-widget">
    <div class="widget-title">
        <span>🏆 FIFA 2026 Live Update</span>
        <span id="current-date" style="font-size: 10px; opacity: 0.8;"></span>
    </div>
    <div id="fifa-matches"></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="player" id="player">
    <div class="player-controls">
        <button class="player-btn close-btn" onclick="closePlayer()">✕</button>
        <button class="player-btn" onclick="toggleRotateFallback()">⛶</button>
    </div>
    <video id="video" controls autoplay playsinline></video>
</div>

<script>
const playlists = [
    {name:'Fifa2026',url:'https://raw.githubusercontent.com/hasanraf/FIfa/refs/heads/main/Fifa2026.m3u'},
    {name:'BDTV',url:'https://raw.githubusercontent.com/hasanraf/BDzone/refs/heads/main/BDTv.m3u'},
    {name:'Sports',url:'https://raw.githubusercontent.com/hasanraf/sports/refs/heads/main/sports.m3u'},
    {name:'Entertainment',url:'https://raw.githubusercontent.com/hasanraf/entertainment/refs/heads/main/entertainment.m3u'},
    {name:'Movies',url:'https://raw.githubusercontent.com/hasanraf/Movies/refs/heads/main/movie.m3u'},
    {name:'Music',url:'https://raw.githubusercontent.com/hasanraf/musicandother/refs/heads/main/musicandother.m3u'},
    {name:'News',url:'https://raw.githubusercontent.com/hasanraf/News/refs/heads/main/news.m3u'},
    {name:'Kids',url:'https://raw.githubusercontent.com/hasanraf/Kids/refs/heads/main/kids.m3u'},
    {name:'Wild Life',url:'https://raw.githubusercontent.com/hasanraf/wildlife/refs/heads/main/wild.m3u'}
];

const dailyMatches = [
    { home: "Mexico", away: "South Africa", hScore: 2, aScore: 1, status: "LIVE", meta: "Group A" },
    { home: "USA", away: "Paraguay", hScore: 0, aScore: 0, status: "UPCOMING", meta: "06:00 PM" },
    { home: "Canada", away: "Bosnia", hScore: 1, aScore: 3, status: "FINISHED", meta: "Ended" }
];

function initFifaWidget() {
    const options = { month: 'short', day: 'numeric', year: 'numeric' };
    document.getElementById("current-date").innerText = new Date().toLocaleDateString('en-US', options);

    const container = document.getElementById("fifa-matches");
    container.innerHTML = "";
    
    dailyMatches.forEach(m => {
        const isLive = m.status === "LIVE";
        const statusColor = isLive ? '#10b981' : (m.status === "FINISHED" ? '#64748b' : '#38bdf8');
        
        container.innerHTML += `
            <div class="match-box">
                <div class="match-teams">
                    <span class="team" style="text-align:right; width:42%;">${m.home}</span>
                    <div class="score-area">${m.hScore} - ${m.aScore}</div>
                    <span class="team" style="text-align:left; width:42%;">${m.away}</span>
                </div>
                <div class="match-meta">
                    <span class="match-time">${m.meta}</span>
                    <span class="match-status" style="color: ${statusColor}">
                        ${isLive ? '<span class="live-dot"></span>' : ''}${m.status}
                    </span>
                </div>
            </div>
        `;
    });
}

// Tabs Generator
const tabs = document.getElementById("tabs");
playlists.forEach((p, i) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (i === 0 ? " active" : "");
    tab.innerText = p.name;
    tab.onclick = () => loadCategory(p.url, tab);
    tabs.appendChild(tab);
});

// Load M3U
async function loadCategory(url, tab) {
    try {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        
        const res = await fetch(url);
        if(!res.ok) throw new Error();
        const text = await res.text();
        const lines = text.split("\n");
        let channels = [];

        for(let i = 0; i < lines.length; i++) {
            if(lines[i].includes("#EXTINF")) {
                const nameLine = lines[i];
                let name = (nameLine.split(",")[1] || "Channel").trim();
                const stream = lines[i+1]?.trim();

                if(stream && stream.startsWith("http")) {
                    let logoMatch = nameLine.match(/tvg-logo="(.*?)"/);
                    let logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/70";
                    let groupMatch = nameLine.match(/group-title="(.*?)"/);
                    let group = groupMatch ? groupMatch[1] : tab.innerText;

                    channels.push({ name, url: stream, logo, group });
                }
            }
        }
        renderChannels(channels);
    } catch(err) {
        document.getElementById("grid").innerHTML = `<div class="error">⚠️ Failed to load channels.</div>`;
    }
}

function renderChannels(list) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    if(list.length === 0) {
        grid.innerHTML = `<div class="error">⚠️ No channels found.</div>`;
        return;
    }
    list.forEach(ch => {
        grid.innerHTML += `
            <div class="card" onclick="playStream('${ch.url.replace(/'/g, "\\'")}')">
                <img class="logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/70'">
                <div class="name">${escapeHtml(ch.name)}</div>
                <div class="group">${escapeHtml(ch.group)}</div>
                <div class="live-badge">LIVE</div>
            </div>
        `;
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

// Advanced Video Player & Screen Orientation Control
let hls;
const playerEl = document.getElementById("player");
const videoEl = document.getElementById("video");

function playStream(url) {
    playerEl.style.display = "block";
    playerEl.classList.add("force-rotate"); // প্লে করার সাথে সাথেই পাতাল স্ক্রিন অন হবে
    
    if (hls) hls.destroy();
    videoEl.pause();
    videoEl.src = "";

    // সিস্টেম ফুলস্ক্রিন রিকোয়েস্ট (সাপোর্টেড ডিভাইসের জন্য)
    if (playerEl.requestFullscreen) {
        playerEl.requestFullscreen().then(() => {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }).catch(() => {});
    } else if (videoEl.webkitEnterFullscreen) {
        videoEl.webkitEnterFullscreen(); // iOS Safari সাপোর্ট
    }

    // HLS Stream Loading
    if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(e => console.log(e)));
    } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
        videoEl.src = url;
        videoEl.play().catch(e => console.log(e));
    }
}

// ম্যানুয়ালি ওরিয়েন্টেশন সোজা-বাঁকা করার বাটন লজিক
function toggleRotateFallback() {
    playerEl.classList.toggle("force-rotate");
}

function closePlayer() {
    playerEl.style.display = "none";
    playerEl.classList.remove("force-rotate");
    videoEl.pause();
    videoEl.src = "";
    
    if (document.fullscreenElement) document.exitFullscreen();
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    if (hls) { hls.destroy(); hls = null; }
}

// ফুলস্ক্রিন থেকে এক্সিট করলে যেন ওরিয়েন্টেশন রিসেট হয়
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
        playerEl.classList.remove("force-rotate");
        if(playerEl.style.display === "block") {
            closePlayer();
        }
    }
});

window.onload = function() {
    initFifaWidget();
    const firstTab = document.querySelector(".tab");
    if(firstTab) loadCategory(playlists[0].url, firstTab);
};
</script>
</body>
</html>
